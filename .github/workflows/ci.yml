---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.0
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
          architecture: x64

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Files require gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Vet and static analysis
        run: go vet ./...

      - name: Run test suite
        run: go test ./...

      - name: Run race-tested suite
        run: go test -race ./...

      - name: Verify pinned consumer contract
        run: go test ./internal/compat -run '^TestNoMistakesV1454Contract$' -count=1

      - name: Verify GitLab protocol and security behavior
        run: go test ./internal/gitlab -run '^TestFakeGitLab$' -count=1

      - name: Check package documentation
        shell: bash
        run: |
          while IFS= read -r package; do
            go doc "${package}" >/dev/null
          done < <(go list ./...)

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: ''
          - os: windows-2022
            suffix: .exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
          architecture: x64

      - name: Build native and compatibility clients
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/glab-axi${{ matrix.suffix }}" ./cmd/glab-axi
          go build -trimpath -o "dist/glab${{ matrix.suffix }}" ./cmd/glab-compat
