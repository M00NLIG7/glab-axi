---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.0
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
          architecture: x64

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Files require gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Vet and static analysis
        run: go vet ./...

      - name: Run test suite
        run: go test ./...

      - name: Run race-tested suite
        run: go test -race ./...

      - name: Verify generated help, schemas, and Agent Skill
        run: go test ./internal/product -run '^(TestGeneratedPublicAssetsMatchCommandRegistry|TestEveryCommandDeclaresAUniqueDataSchema)$' -count=1

      - name: Verify pinned consumer contracts
        shell: bash
        run: |
          go test ./internal/compat -run '^TestNoMistakesV1454Contract$' -count=1
          go test ./internal/product \
            -run '^(TestPinnedFirstmateConsumerContractDrivesExactMergeGrammar|TestPinnedIssueEditConsumerContractDrivesGrammar)$' \
            -count=1

      - name: Verify GitLab protocol and security behavior
        shell: bash
        run: |
          go test ./internal/gitlab -run '^TestFakeGitLab$' -count=1
          go test ./internal/product -run '^(TestIssueEdit|TestMRMerge)' -count=1

      - name: Check package documentation
        shell: bash
        run: |
          while IFS= read -r package; do
            go doc "${package}" >/dev/null
          done < <(go list ./...)

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo: '0'
            suffix: ''
          - os: windows-2022
            goos: windows
            goarch: amd64
            cgo: '0'
            suffix: .exe
          - os: macos-14
            goos: darwin
            goarch: amd64
            cgo: '1'
            suffix: ''
          - os: macos-14
            goos: darwin
            goarch: arm64
            cgo: '1'
            suffix: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
          architecture: x64

      - name: Build canonical product, compatibility alias, and test artifacts
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist/test-only
          go build -trimpath -o "dist/gl-axi${{ matrix.suffix }}" ./cmd/gl-axi
          go build -trimpath -o "dist/glab-axi${{ matrix.suffix }}" ./cmd/glab-axi
          go build -trimpath -o "dist/test-only/glab${{ matrix.suffix }}" ./cmd/glab-compat
          go build -trimpath -o "dist/test-only/release-manifest${{ matrix.suffix }}" ./cmd/release-manifest
          if [[ "${GOOS}" == "$(go env GOHOSTOS)" && "${GOARCH}" == "$(go env GOHOSTARCH)" ]]; then
            test "$("dist/gl-axi${{ matrix.suffix }}" --version)" = "gl-axi 0.2.0 (contract glab-axi/v1)"
            test "$("dist/glab-axi${{ matrix.suffix }}" --version)" = "glab-axi 0.2.0 (contract glab-axi/v1)"
          fi

      - name: Run Windows login terminal regressions
        if: matrix.goos == 'windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go test ./internal/product -run '^TestProductLoginPreservesCallerLifetime$' -count=1
          go test ./internal/delegate/glab \
            -run '^(TestWindowsLoginTerminalModesAreRestored|TestWindowsConPTYLoginLifecycleAndSafety|TestLoginMonitorRejectsMalformedAndOversizedOutput)$' \
            -count=1

  upstream-contract:
    name: Official glab v1.112.0 offline contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
          architecture: x64

      - name: Fetch checksum-pinned public package without installing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-glab
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output upstream-glab/glab.tar.gz \
            https://gitlab.com/gitlab-org/cli/-/releases/v1.112.0/downloads/glab_1.112.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            f1c52907558b665f2032b615787d353cd06e54240b501a81f9489bfc8f6a8ebf \
            upstream-glab/glab.tar.gz | sha256sum --check --strict
          tar -xzf upstream-glab/glab.tar.gz -C upstream-glab

      - name: Execute version, help, TLS read, and guarded MR write contract surfaces
        env:
          GL_AXI_OFFICIAL_GLAB_TEST_BINARY: ${{ github.workspace }}/upstream-glab/bin/glab
        run: go test ./internal/delegate/glab -run '^(TestPinnedUpstreamPublicContract|TestPinnedOfficialGlabEnsureCreateTLS|TestPinnedOfficialGlabMRViewTLS|TestPinnedOfficialGlabMRDiscussionsTLS|TestPinnedOfficialGlabIssueEditTLS|TestPinnedOfficialGlabMRMergeTLS)$' -count=1
